name: Release Windows Client (AYURCASE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: AYURCASE/client/package.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: AYURCASE/client/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: AYURCASE/client
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: AYURCASE/client
        run: npm run build

      - name: Build Tauri Windows Bundle
        working-directory: AYURCASE/client
        run: npx --yes @tauri-apps/cli build

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: AYURCASE-Windows-v1.0.0
          if-no-files-found: warn
          path: |
            AYURCASE/client/src-tauri/target/release/bundle/nsis/*.exe
            AYURCASE/client/src-tauri/target/release/bundle/msi/*.msi
